          <h1>عائلة بجاتو</h1>
          <p>
            عائلة بجاتو من عائلات الصعيد التي يتركز انتشارها في فاو قبلي وما
            حولها. وتروي أخبارها أن أصول بعض فروعها تعود إلى أسر متعددة استقرت في
            ريف المنطقة، ثم تقاربت بمرور الزمن بالمصاهرة والجوار والعمل، حتى غلب
            عليها اسم بجاتو. ويرتبط جانب من تاريخها بخدمة القصر الحاكم في العصر
            العثماني، وبأدوار إدارية واجتماعية امتد أثرها إلى محيط فاو قبلي.
          </p>
          <h2>١. الأصل والنشأة التاريخية</h2>
          <p>
            تنسب الروايات العائلية أصول بعض البيوت الأولى إلى أسر من الغجر انتقلت
            إلى ريف فاو قبلي واستقرت فيه. والتحق بعض أبنائها بخدمة القصر الحاكم
            في العصر العثماني، ومن أشهرهم الأغا سراج في فرع دار الخدمة، الذي
            عُرف بلقب «أغا تو» بمعنى «الأغا السابق»، وتحوّر اللفظ حتى استقر على
            بجاتو.
          </p>
          <h2>٢. الفروع والامتداد الجغرافي</h2>
          <p>
            تشمل الفروع الرئيسية المتداولة: فرع فاو قبلي، وفرع دار الخدمة، وفرع
            النجوع.
          </p>
